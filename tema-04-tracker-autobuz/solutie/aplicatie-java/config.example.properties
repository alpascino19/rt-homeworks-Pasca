# Copiați acest fișier ca config.properties (în folderul aplicatie-java/) și completați-l.
# config.properties este ignorat de git: NU îl urcați pe GitHub.
# Orice valoare poate fi dată și prin variabila de mediu din paranteză (are prioritate).

# API REST CTP Cluj live
api.url=https://control.aut.utcluj.ro/publictransport
# (CHEIE_API) cheia primită la laborator
api.key=cheia-voastra

# RabbitMQ (RABBIT_HOST, RABBIT_PORT, RABBIT_USER, RABBIT_PASS)
rabbit.host=control.aut.utcluj.ro
rabbit.port=11156
rabbit.user=utilizator
rabbit.pass=parola

# MQTT: brokerul cursului, fără autentificare. student = STUDENT din config.h al plăcii.
mqtt.broker=tcp://control.aut.utcluj.ro:11188
mqtt.student=Pasca-Alex

# Opțional: pragurile stărilor (valorile implicite sunt cele de mai jos)
# rezervă = ETA - timp de mers pe jos; sub prag.pleaca_s => PLEACA, sub 0 => GRABESTE_TE
#prag.pleaca_s=180
# distanța pe drum sub care autobuzul e IN_STATIE
#prag.in_statie_m=80
# marja cerută la revenirea într-o stare mai puțin urgentă (LED-ul nu pâlpâie)
#histerezis.s=30
#histerezis.m=30
# viteza folosită până se observă viteza reală a autobuzului (5 m/s = 18 km/h)
#viteza.implicita_mps=5
